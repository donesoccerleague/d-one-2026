<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>D-One Soccer League 2025 Fixtures</title>
    <link rel="stylesheet" href="fixture.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <h1>D-One Soccer League 2025 Fixtures</h1>
        <img src="d-one-logo.jpg" alt="League logo will be here">
        <nav>
            <button><a href="homepage.html">Home</a></button>
            <button><a href="rulesandlaws.html">Rules and Law</a></button>
            <button><a href="teams.html">Teams</a></button>
            <button><a href="aboutus.html">About Us</a></button>
            <button><a href="standings.html">Standings</a></button>
            <button><a href="staff.html">Staff</a></button>
            <button><a href="sponsorship.html">Sponsorship</a></button>
            <button><a href="register.html">Register Team</a></button>
            <button><a href="adminlogin.html">Admin Login</a></button>
            <button class="active" onclick="window.location.href='fixtures.html'">Fixtures</button>
            <button type="button" disabled style="background:transparent; color:#333; border:none;">Language</button>
            <select onchange="changeLanguage(this.value)">
                <option value="english">English</option>
                <option value="spanish">Spanish</option>
                <option value="french">French</option>
            </select>
            <script>
                function changeLanguage(language) {
                    if (language === 'english') {
                        window.location.href = 'homepage.html';
                    } else if (language === 'spanish') {
                        window.location.href = 'homepagees.html';
                    } else if (language === 'french') {
                        window.location.href = 'homepagefr.html';
                    }
                }
            </script>
        </nav>
    </header>
    <main>
        <section>
            <h2>Master Schedule</h2>
            <div class="fixtures-list" id="fixturesList"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    const SUPABASE_URL = 'https://dpwwjhjnfyaraawvapsa.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_NkvBXTR9sHUT18tLnrXygQ_tk6KIlFj';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const fixturesList = document.getElementById('fixturesList');

    function toTime(value) {
        if (!value) {
            return 'TBA';
        }
        return String(value).slice(0, 5);
    }

    function renderFixtures(fixtures) {
        fixturesList.innerHTML = '';

        const grouped = {};
        fixtures.forEach((fixture) => {
            const key = fixture.match_date;
            if (!grouped[key]) {
                grouped[key] = [];
            }
            grouped[key].push(fixture);
        });

        const dates = Object.keys(grouped).sort();
        if (dates.length === 0) {
            fixturesList.innerHTML = '<p>No fixtures available yet.</p>';
            return;
        }

        dates.forEach((date) => {
            const title = document.createElement('h3');
            title.textContent = date;
            fixturesList.appendChild(title);

            const list = document.createElement('ul');
            grouped[date].forEach((fixture) => {
                const item = document.createElement('li');
                item.textContent = `${toTime(fixture.match_time)} - ${fixture.home_team}: ${fixture.home_score} vs ${fixture.away_team}: ${fixture.away_score}`;
                list.appendChild(item);
            });
            fixturesList.appendChild(list);
        });
    }

    async function loadFixtures() {
        const { data, error } = await client.rpc('public_list_fixtures');
        if (error) {
            console.error('Could not load fixtures:', error);
            fixturesList.innerHTML = '<p>Could not load fixtures.</p>';
            return;
        }

        renderFixtures(Array.isArray(data) ? data : []);
    }

    loadFixtures();
    </script>
</body>
</html>
