<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
    <title>D-One Soccer League - Standings</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
</head>
<body>
    <header>
        <nav>
            <button onclick="location.href='rulesandlaws.html'">Rules and Laws</button>
            <button onclick="location.href='teams.html'">Teams</button>
            <button onclick="location.href='aboutus.html'">About Us</button>
            <button onclick="location.href='fixtures.html'">Matches</button>
            <button onclick="location.href='homepage.html'">Home Page</button>
            <button onclick="location.href='sponsorship.html'">Sponsorship</button>
            <button onclick="location.href='register.html'">Register Team</button>
        </nav>
    </header>
    <main>
        <section>
            <h2>Group A</h2>
            <table>
                <tr>
                    <th>Position</th>
                    <th>Team</th>
                    <th>Played</th>
                    <th>GS</th>
                    <th>GC</th>
                    <th>GD</th>
                    <th>Points</th>
                </tr>
                <tbody id="groupA"></tbody>
            </table>
        </section>

        <section>
            <h2>Group B</h2>
            <table>
                <tr>
                    <th>Position</th>
                    <th>Team</th>
                    <th>Played</th>
                    <th>GS</th>
                    <th>GC</th>
                    <th>GD</th>
                    <th>Points</th>
                </tr>
                <tbody id="groupB"></tbody>
            </table>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    const SUPABASE_URL = 'https://dpwwjhjnfyaraawvapsa.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_NkvBXTR9sHUT18tLnrXygQ_tk6KIlFj';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const groupAEl = document.getElementById('groupA');
    const groupBEl = document.getElementById('groupB');

    function renderGroupRows(container, teams) {
        container.innerHTML = '';

        if (!teams.length) {
            container.innerHTML = '<tr><td colspan="8">No teams yet.</td></tr>';
            return;
        }

        teams.forEach((team, index) => {
            const gd = Number(team.goals_scored || 0) - Number(team.goals_conceded || 0);
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${team.team_name}</td>
                <td>${team.played}</td>
                <td>${team.goals_scored}</td>
                <td>${team.goals_conceded}</td>
                <td>${gd}</td>
                <td>${team.points}</td>
            `;
            container.appendChild(row);
        });
    }

    async function loadStandings() {
        const { data, error } = await client.rpc('public_list_teams');
        if (error) {
            console.error('Could not load standings:', error);
            groupAEl.innerHTML = '<tr><td colspan="8">Could not load standings.</td></tr>';
            groupBEl.innerHTML = '<tr><td colspan="8">Could not load standings.</td></tr>';
            return;
        }

        const teams = Array.isArray(data) ? data : [];
        const groupA = teams.filter((t) => t.team_group === 'A');
        const groupB = teams.filter((t) => t.team_group === 'B');
        renderGroupRows(groupAEl, groupA);
        renderGroupRows(groupBEl, groupB);
    }

    loadStandings();
    </script>
</body>
</html>
