<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header>
        <h1>D-One Soccer League Admin Dashboard</h1>
        <div class="admin-top-actions">
            <button type="button" onclick="location.href='homepage.html'">Public Site</button>
            <button type="button" id="logoutBtn">Logout</button>
        </div>
    </header>

    <main class="admin-dashboard">
        <p id="statusMessage" class="status-message" style="display:none;"></p>

        <section class="admin-card">
            <h2>Add Team</h2>
            <form id="addTeamForm">
                <label for="teamName">Team Name</label>
                <input type="text" id="teamName" required>

                <label for="teamGroup">Group</label>
                <select id="teamGroup" required>
                    <option value="A">A</option>
                    <option value="B">B</option>
                </select>

                <button type="submit">Add Team</button>
            </form>
        </section>

        <section class="admin-card">
            <h2>Update Team Group</h2>
            <form id="updateTeamGroupForm">
                <label for="teamSelect">Select Team</label>
                <select id="teamSelect" required></select>

                <label for="newGroup">New Group</label>
                <select id="newGroup" required>
                    <option value="A">A</option>
                    <option value="B">B</option>
                </select>

                <button type="submit">Update Group</button>
            </form>
        </section>

        <section class="admin-card">
            <h2>Add Fixture</h2>
            <form id="addFixtureForm">
                <label for="addMatchDate">Match Date</label>
                <input type="date" id="addMatchDate" required>

                <label for="addMatchTime">Match Time</label>
                <input type="time" id="addMatchTime" required>

                <label for="addHomeTeam">Home Team</label>
                <select id="addHomeTeam" required></select>

                <label for="addAwayTeam">Away Team</label>
                <select id="addAwayTeam" required></select>

                <button type="submit">Add Fixture</button>
            </form>
        </section>

        <section class="admin-card">
            <h2>Update Fixture</h2>
            <form id="updateFixtureForm">
                <label for="fixtureSelect">Select Fixture</label>
                <select id="fixtureSelect" required></select>

                <label for="editMatchDate">Match Date</label>
                <input type="date" id="editMatchDate" required>

                <label for="editMatchTime">Match Time</label>
                <input type="time" id="editMatchTime" required>

                <label for="editHomeTeam">Home Team</label>
                <select id="editHomeTeam" required></select>

                <label for="editAwayTeam">Away Team</label>
                <select id="editAwayTeam" required></select>

                <label for="homeScore">Home Score</label>
                <input type="number" id="homeScore" min="0" value="0" required>

                <label for="awayScore">Away Score</label>
                <input type="number" id="awayScore" min="0" value="0" required>

                <button type="submit">Save Fixture Changes</button>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    const SUPABASE_URL = 'https://dpwwjhjnfyaraawvapsa.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_NkvBXTR9sHUT18tLnrXygQ_tk6KIlFj';

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const adminSessionToken = localStorage.getItem('admin_session_token');

    const statusMessage = document.getElementById('statusMessage');
    const teamSelect = document.getElementById('teamSelect');
    const addHomeTeam = document.getElementById('addHomeTeam');
    const addAwayTeam = document.getElementById('addAwayTeam');
    const editHomeTeam = document.getElementById('editHomeTeam');
    const editAwayTeam = document.getElementById('editAwayTeam');
    const fixtureSelect = document.getElementById('fixtureSelect');

    let teams = [];
    let fixtures = [];

    function showStatus(message, isError) {
        statusMessage.textContent = message;
        statusMessage.style.display = 'block';
        statusMessage.style.background = isError ? '#6b1b1b' : '#1f5f33';
        statusMessage.style.color = '#fff';
    }

    function clearStatus() {
        statusMessage.style.display = 'none';
    }

    function requireLogin() {
        if (!adminSessionToken) {
            window.location.href = 'adminlogin.html';
            return false;
        }
        return true;
    }

    function fixtureLabel(fixture) {
        return `${fixture.match_date} ${fixture.match_time} - ${fixture.home_team} vs ${fixture.away_team}`;
    }

    function buildTeamOptions(selectElement, selectedId) {
        selectElement.innerHTML = '';
        teams.forEach(team => {
            const option = document.createElement('option');
            option.value = String(team.id);
            option.textContent = `${team.team_name} (Group ${team.team_group})`;
            if (selectedId && String(selectedId) === String(team.id)) {
                option.selected = true;
            }
            selectElement.appendChild(option);
        });
    }

    function refreshTeamSelectors() {
        buildTeamOptions(teamSelect);
        buildTeamOptions(addHomeTeam);
        buildTeamOptions(addAwayTeam);
        buildTeamOptions(editHomeTeam);
        buildTeamOptions(editAwayTeam);
    }

    function refreshFixtureSelector() {
        fixtureSelect.innerHTML = '';
        fixtures.forEach(fixture => {
            const option = document.createElement('option');
            option.value = String(fixture.id);
            option.textContent = fixtureLabel(fixture);
            fixtureSelect.appendChild(option);
        });

        if (fixtures.length > 0) {
            populateFixtureForm(fixtures[0].id);
        }
    }

    function populateFixtureForm(fixtureId) {
        const fixture = fixtures.find(item => String(item.id) === String(fixtureId));
        if (!fixture) {
            return;
        }

        document.getElementById('editMatchDate').value = fixture.match_date;
        document.getElementById('editMatchTime').value = (fixture.match_time || '').slice(0, 5);
        buildTeamOptions(editHomeTeam, fixture.home_team_id);
        buildTeamOptions(editAwayTeam, fixture.away_team_id);
        document.getElementById('homeScore').value = fixture.home_score;
        document.getElementById('awayScore').value = fixture.away_score;
    }

    async function loadTeams() {
        const { data, error } = await client.rpc('admin_list_teams', {
            p_session_token: adminSessionToken
        });

        if (error) {
            throw error;
        }

        teams = Array.isArray(data) ? data : [];
        refreshTeamSelectors();
    }

    async function loadFixtures() {
        const { data, error } = await client.rpc('admin_list_fixtures', {
            p_session_token: adminSessionToken
        });

        if (error) {
            throw error;
        }

        fixtures = Array.isArray(data) ? data : [];
        refreshFixtureSelector();
    }

    async function initializeDashboard() {
        if (!requireLogin()) {
            return;
        }

        try {
            await loadTeams();
            await loadFixtures();
            clearStatus();
        } catch (error) {
            console.error('Dashboard init failed:', error);
            showStatus('Could not load admin data. Your session may be expired.', true);
        }
    }

    document.getElementById('addTeamForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const teamName = document.getElementById('teamName').value.trim();
        const teamGroup = document.getElementById('teamGroup').value;

        try {
            const { data, error } = await client.rpc('admin_add_team', {
                p_session_token: adminSessionToken,
                p_team_name: teamName,
                p_team_group: teamGroup
            });

            if (error) {
                throw error;
            }

            const result = Array.isArray(data) ? data[0] : data;
            if (!result || result.ok !== true) {
                showStatus(result ? result.message : 'TEAM_ADD_FAILED', true);
                return;
            }

            showStatus('Team added.', false);
            document.getElementById('addTeamForm').reset();
            await loadTeams();
        } catch (error) {
            console.error('Add team failed:', error);
            showStatus('Could not add team.', true);
        }
    });

    document.getElementById('updateTeamGroupForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const selectedTeamId = Number(teamSelect.value);
        const newGroup = document.getElementById('newGroup').value;

        try {
            const { data, error } = await client.rpc('admin_update_team_group', {
                p_session_token: adminSessionToken,
                p_team_id: selectedTeamId,
                p_team_group: newGroup
            });

            if (error) {
                throw error;
            }

            const result = Array.isArray(data) ? data[0] : data;
            if (!result || result.ok !== true) {
                showStatus(result ? result.message : 'TEAM_GROUP_UPDATE_FAILED', true);
                return;
            }

            showStatus('Team group updated.', false);
            await loadTeams();
            await loadFixtures();
        } catch (error) {
            console.error('Update team group failed:', error);
            showStatus('Could not update team group.', true);
        }
    });

    document.getElementById('addFixtureForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const matchDate = document.getElementById('addMatchDate').value;
        const matchTime = document.getElementById('addMatchTime').value;
        const homeTeamId = Number(addHomeTeam.value);
        const awayTeamId = Number(addAwayTeam.value);

        if (homeTeamId === awayTeamId) {
            showStatus('Home and away teams must be different.', true);
            return;
        }

        try {
            const { data, error } = await client.rpc('admin_add_fixture', {
                p_session_token: adminSessionToken,
                p_match_date: matchDate,
                p_match_time: matchTime,
                p_home_team_id: homeTeamId,
                p_away_team_id: awayTeamId
            });

            if (error) {
                throw error;
            }

            const result = Array.isArray(data) ? data[0] : data;
            if (!result || result.ok !== true) {
                showStatus(result ? result.message : 'FIXTURE_ADD_FAILED', true);
                return;
            }

            showStatus('Fixture added.', false);
            document.getElementById('addFixtureForm').reset();
            await loadFixtures();
        } catch (error) {
            console.error('Add fixture failed:', error);
            showStatus('Could not add fixture.', true);
        }
    });

    fixtureSelect.addEventListener('change', function () {
        populateFixtureForm(this.value);
    });

    document.getElementById('updateFixtureForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const fixtureId = Number(fixtureSelect.value);
        const matchDate = document.getElementById('editMatchDate').value;
        const matchTime = document.getElementById('editMatchTime').value;
        const homeTeamId = Number(editHomeTeam.value);
        const awayTeamId = Number(editAwayTeam.value);
        const homeScore = Number(document.getElementById('homeScore').value);
        const awayScore = Number(document.getElementById('awayScore').value);

        if (homeTeamId === awayTeamId) {
            showStatus('Home and away teams must be different.', true);
            return;
        }

        try {
            const { data, error } = await client.rpc('admin_update_fixture', {
                p_session_token: adminSessionToken,
                p_fixture_id: fixtureId,
                p_match_date: matchDate,
                p_match_time: matchTime,
                p_home_team_id: homeTeamId,
                p_away_team_id: awayTeamId,
                p_home_score: homeScore,
                p_away_score: awayScore
            });

            if (error) {
                throw error;
            }

            const result = Array.isArray(data) ? data[0] : data;
            if (!result || result.ok !== true) {
                showStatus(result ? result.message : 'FIXTURE_UPDATE_FAILED', true);
                return;
            }

            showStatus('Fixture updated.', false);
            await loadFixtures();
        } catch (error) {
            console.error('Update fixture failed:', error);
            showStatus('Could not update fixture.', true);
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', async function () {
        try {
            await client.rpc('admin_logout', { p_session_token: adminSessionToken });
        } catch (error) {
            console.error('Logout warning:', error);
        }

        localStorage.removeItem('admin_session_token');
        localStorage.removeItem('admin_id');
        window.location.href = 'adminlogin.html';
    });

    initializeDashboard();
    </script>
</body>
</html>
