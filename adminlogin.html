<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <h1>Admin Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="submit">
                <button type="submit">Login</button>
            </div>
            <div class="form-group" id="loginMessage" style="color: #c62828; display: none;"></div>
            <div class="form-group">
                <p>Don't have an account? <a href="mailto:d.one.soccer@gmail.com">Contact your employer</a></p>
            </div>
        </form>
        <div class="form-group" style="margin-top: 16px;">
            <button type="button" id="toggleDebugBtn">Show Debug</button>
            <button type="button" id="testConnectionBtn">Test Supabase Connection</button>
        </div>
        <pre id="debugPanel" style="display:none; background:#111; color:#8efc8a; padding:12px; border-radius:8px; max-height:260px; overflow:auto; white-space:pre-wrap;"></pre>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://dpwwjhnjfyaaraawvapsa.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_NkvBXTR9sHUT18tLnrXygQ_tk6KIlFj';

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const form = document.getElementById('loginForm');
const messageBox = document.getElementById('loginMessage');
const debugPanel = document.getElementById('debugPanel');
const toggleDebugBtn = document.getElementById('toggleDebugBtn');
const testConnectionBtn = document.getElementById('testConnectionBtn');

function nowTime() {
    return new Date().toISOString();
}

function safeJson(value) {
    try {
        return JSON.stringify(value, null, 2);
    } catch (_error) {
        return String(value);
    }
}

function debugLog(label, details) {
    const line = `[${nowTime()}] ${label}${details ? `\n${safeJson(details)}` : ''}\n\n`;
    debugPanel.textContent += line;
    debugPanel.scrollTop = debugPanel.scrollHeight;
    console.log(label, details || '');
}

function showMessage(message) {
    messageBox.textContent = message;
    messageBox.style.display = 'block';
}

function showFetchHelp() {
    showMessage(
        'Cannot reach Supabase (Failed to fetch). Use Live Server/http://localhost (not file://), verify URL/key, and ensure your Supabase project is active.'
    );
}

toggleDebugBtn.addEventListener('click', function () {
    const shouldShow = debugPanel.style.display === 'none';
    debugPanel.style.display = shouldShow ? 'block' : 'none';
    toggleDebugBtn.textContent = shouldShow ? 'Hide Debug' : 'Show Debug';
});

async function runStartupDebugCheck() {
    debugLog('Startup check: Supabase client initialized', {
        supabaseUrl: SUPABASE_URL,
        keyPrefix: SUPABASE_ANON_KEY.slice(0, 20) + '...'
    });

    const { data, error } = await client.rpc('validate_admin_login', {
        p_email: 'debug-check@example.com',
        p_password: 'invalid'
    });

    debugLog('Startup check: validate_admin_login RPC response', { data, error });
}

runStartupDebugCheck().catch((error) => {
    debugLog('Startup check failed', {
        message: error.message,
        stack: error.stack
    });
});

testConnectionBtn.addEventListener('click', async function () {
    debugLog('Manual connection test started', {
        protocol: window.location.protocol,
        online: navigator.onLine,
        supabaseUrl: SUPABASE_URL
    });

    try {
        const { error } = await client.rpc('validate_admin_login', {
            p_email: 'connection-test@example.com',
            p_password: 'invalid'
        });

        if (error && error.message === 'TypeError: Failed to fetch') {
            debugLog('Manual connection test failed (network)', { error });
            showFetchHelp();
            return;
        }

        debugLog('Manual connection test completed', { error: error || null });
        showMessage('Supabase connection is reachable.');
    } catch (error) {
        debugLog('Manual connection test exception', {
            message: error.message,
            stack: error.stack
        });

        if (String(error.message || '').toLowerCase().includes('failed to fetch')) {
            showFetchHelp();
            return;
        }

        showMessage('Connection test error: ' + (error.message || 'Unknown error'));
    }
});

form.addEventListener('submit', async function (event) {
    event.preventDefault();
    messageBox.style.display = 'none';

    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    debugLog('Login submit started', {
        email,
        passwordLength: password.length
    });

    try {
        debugLog('Calling RPC validate_admin_login', {
            functionName: 'validate_admin_login',
            params: {
                p_email: email,
                p_password: '[hidden]'
            }
        });

        const { data, error } = await client.rpc('validate_admin_login', {
            p_email: email,
            p_password: password
        });

        debugLog('RPC response received', { data, error });

        if (error) {
            console.error('Supabase login check failed:', error);
            if (String(error.message || '').toLowerCase().includes('failed to fetch')) {
                showFetchHelp();
                return;
            }
            showMessage(
                'Login service error: ' +
                (error.message || 'Unknown error') +
                (error.code ? ` | code: ${error.code}` : '')
            );
            return;
        }

        const result = Array.isArray(data) ? data[0] : data;
        debugLog('Parsed RPC result', { result });

        if (!result || result.ok !== true) {
            showMessage('Invalid email or password.');
            return;
        }

        localStorage.setItem('admin_session_token', result.session_token || '');
        localStorage.setItem('admin_id', String(result.admin_id || ''));

        debugLog('Login success, session stored', {
            adminId: result.admin_id,
            hasSessionToken: Boolean(result.session_token)
        });

        window.location.href = 'adminHomePage.html';
    } catch (error) {
        console.error('Unexpected login error:', error);
        debugLog('Unexpected exception during login', {
            message: error.message,
            stack: error.stack
        });

        if (String(error.message || '').toLowerCase().includes('failed to fetch')) {
            showFetchHelp();
            return;
        }

        showMessage('An unexpected error occurred: ' + (error.message || 'Unknown error'));
    }
});
</script>
</html>
